<style>

(function(){
"use strict";

/* ---------- STARFIELD ---------- */
const starCanvas = document.getElementById('stars');
const sctx = starCanvas.getContext('2d');
let starPts = [];
function drawStars(){
  if(starPts.length===0){ for(let i=0;i<140;i++) starPts.push({x:Math.random(), y:Math.random(), r:Math.random()*1.6+0.4, a:Math.random()*.6+.3}); }
  sctx.clearRect(0,0,starCanvas.width, starCanvas.height);
  sctx.fillStyle = '#fff';
  starPts.forEach(p=>{ sctx.globalAlpha = p.a; sctx.beginPath(); sctx.arc(p.x*starCanvas.width, p.y*starCanvas.height, p.r, 0, 7); sctx.fill(); });
  sctx.globalAlpha = 1;
}
function sizeStars(){ starCanvas.width = innerWidth; starCanvas.height = innerHeight; drawStars(); }
window.addEventListener('resize', sizeStars); sizeStars();

/* ---------- STATE ---------- */
const STATE = { idx:0, points:0, votes:{}, lanternLit:[false,false,false,false] };

function addPoints(n){
  STATE.points += n;
  document.getElementById('ptsval').textContent = STATE.points;
  const el = document.getElementById('points');
  el.classList.remove('flash'); void el.offsetWidth;
}
function confettiBurst(count){
  const layer = document.getElementById('confetti');
  const colors = ['#ff3ec9','#2fe6d1','#ffd23f','#8dff5c','#fff'];
  for(let i=0;i<count;i++){
    const c = document.createElement('div');
    c.className='confetto';
    c.style.left = (Math.random()*100)+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    c.style.animation = `fall ${1.6+Math.random()*1.4}s ease-in forwards`;
    layer.appendChild(c);
    setTimeout(()=>c.remove(), 3200);
  }
}
const styleSheet = document.createElement('style');
styleSheet.textContent = `@keyframes fall{to{transform:translateY(100vh) rotate(360deg); opacity:.2;}}`;
document.head.appendChild(styleSheet);

/* ============================================================
   VOTE WIDGET (shared) — buttons mode + camera mode w/ no-camera fallback

let camStream = null;
function stopCam(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
}

  // opts: {onVote(verdict)}
  const wrap = document.createElement('div');
  wrap.innerHTML = `

      </div>
    </div>`;
  root.appendChild(wrap);

  const modeBtnsBtn = wrap.querySelector('#modeBtnsBtn');
  const modeCamBtn = wrap.querySelector('#modeCamBtn');
  const voteButtonsMode = wrap.querySelector('#voteButtonsMode');
  const voteCamMode = wrap.querySelector('#voteCamMode');

  modeCamBtn.onclick = ()=>{ modeCamBtn.classList.add('active'); modeBtnsBtn.classList.remove('active');
    voteButtonsMode.style.display='none'; voteCamMode.style.display=''; };

  wrap.querySelector('#voteRealBtn').onclick = ()=> opts.onVote('tikra');
  wrap.querySelector('#voteFakeBtn').onclick = ()=> opts.onVote('sukurta');

  const camStartBtn = wrap.querySelector('#camStartBtn');
  const camStartWrap = wrap.querySelector('#camStartWrap');
  const camLiveWrap = wrap.querySelector('#camLiveWrap');
  camStartBtn.onclick = async ()=>{
    try{
      camStream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
      const video = wrap.querySelector('#camvideo');
      video.srcObject = camStream;
      camStartWrap.style.display='none'; camLiveWrap.style.display='';
    }catch(e){
      camStartWrap.innerHTML = `<p class="kidtext" style="font-size:15px; color:var(--gold);">⚠️ Kamera nepasiekiama. Naudokite 🖐 Mygtukus.</p>`;

  };
  const camCaptureBtn = wrap.querySelector('#camCaptureBtn');
  const camBars = wrap.querySelector('#camBars');
  const camConfirmBtn = wrap.querySelector('#camConfirmBtn');
  let lastVerdict = null;
  camCaptureBtn.onclick = ()=>{
    const video = wrap.querySelector('#camvideo');
    const canvas = wrap.querySelector('#camcanvas');
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    let greenCount=0, redCount=0;
    try{
      const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
      for(let i=0;i<data.length;i+=16){ // sample every 4th pixel for perf
        const r=data[i], g=data[i+1], b=data[i+2];
        if(g > r+25 && g > b+15) greenCount++;
        else if(r > g+25 && r > b+10) redCount++;
      }
    }catch(e){ greenCount = Math.floor(Math.random()*40)+10; redCount = Math.floor(Math.random()*40)+10; }
    const total = Math.max(1, greenCount+redCount);
    const maxH = 100;
    wrap.querySelector('#barReal').style.height = Math.max(4, (greenCount/total)*maxH)+'px';
    wrap.querySelector('#barFake').style.height = Math.max(4, (redCount/total)*maxH)+'px';
    camBars.style.display='flex';
    lastVerdict = greenCount >= redCount ? 'tikra' : 'sukurta';
    camConfirmBtn.style.display='inline-block';
    camConfirmBtn.textContent = `✔ Patvirtinti: ${lastVerdict==='tikra' ? 'TIKRA' : 'SUKURTA'}`;
  };
  camConfirmBtn.onclick = ()=>{ if(lastVerdict) opts.onVote(lastVerdict); };
  wrap.querySelector('#camStopBtn').onclick = ()=>{
    stopCam(); camLiveWrap.style.display='none'; camStartWrap.style.display=''; camBars.style.display='none'; camConfirmBtn.style.display='none';
  };
}

    render(root, screen){

        </div>

      const voteHost = document.getElementById('voteHost');
      if(!st.voted){
        buildVoteWidget(voteHost, { onVote:(verdict)=>{
          st.voted = true; st.verdict = verdict;
          stopCam();
          const correct = verdict === correctVerdict;
          addPoints(correct ? 10 : 5);

            <div>${flawText.body}</div>
          </div>`;
      }
    }
  };
}

/* ============================================================
   ENGINE
   ============================================================ */
const stageEl = document.getElementById('stage');
const dotsWrap = document.getElementById('progresswrap');
const mnote = document.getElementById('mnote');
const mtext = document.getElementById('mtext');

function buildDots(){ dotsWrap.innerHTML = SCREENS.map((s,i)=>`<div class="pdot" data-i="${i}"></div>`).join(''); }
function updateDots(){
  dotsWrap.querySelectorAll('.pdot').forEach((d,i)=>{
    d.classList.toggle('done', i < STATE.idx);
    d.classList.toggle('now', i === STATE.idx);
  });
}
function render(){
  stopCam();
  const screen = SCREENS[STATE.idx];
  if(!screen.state) screen.state = {};
  stageEl.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'screen';
  stageEl.appendChild(wrapper);
  screen.render(wrapper, screen);
  mtext.innerHTML = `<b>Sakykite:</b> ${screen.mscript}`;
  updateDots();
  document.getElementById('prevBtn').style.visibility = STATE.idx===0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = STATE.idx === SCREENS.length-1 ? '✓ PABAIGA' : 'TOLIAU →';
}
function rerenderCurrent(){
  const screen = SCREENS[STATE.idx];
  stageEl.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'screen';
  stageEl.appendChild(wrapper);
  screen.render(wrapper, screen);
}
function goNext(){ if(STATE.idx < SCREENS.length-1){ STATE.idx++; render(); } }
function goPrev(){ if(STATE.idx > 0){ STATE.idx--; render(); } }
function restart(){
  if(!confirm('Pradėti pamoką iš naujo?')) return;
  stopCam();
  STATE.idx = 0; STATE.points = 0; STATE.lanternLit=[false,false,false,false];
  SCREENS.forEach(s=>{ s.state = {}; });
  document.getElementById('ptsval').textContent = '0';
  render();
}

document.getElementById('nextBtn').onclick = goNext;
document.getElementById('prevBtn').onclick = goPrev;
document.getElementById('restartBtn').onclick = restart;
document.getElementById('mtoggle').onclick = ()=> mnote.classList.toggle('open');

window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key==='ArrowDown') goNext();
  else if(e.key==='ArrowLeft' || e.key==='ArrowUp') goPrev();
  else if(e.key==='r' || e.key==='R') restart();
});
window.addEventListener('beforeunload', stopCam);

buildDots();
render();

})();
